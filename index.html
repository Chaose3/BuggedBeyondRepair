<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chaose3 | Portfolio</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f4f4f4;
      --text: #000000;
      --card-bg: #ffffff;
      --primary: #0366d6;
      --header-bg: #24292e;
      --button-bg: var(--primary);
      --button-text: #ffffff;
    }

    html[data-theme="dark"] {
      --bg: #121212;
      --text: #eeeeee;
      --card-bg: #1e1e1e;
      --primary: #58a6ff;
      --header-bg: #0d1117;
      --button-bg: var(--primary);
      --button-text: #ffffff;
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme]) {
        --bg: #121212;
        --text: #eeeeee;
        --card-bg: #1e1e1e;
        --primary: #58a6ff;
        --header-bg: #0d1117;
        --button-bg: var(--primary);
        --button-text: #ffffff;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    header {
      background-color: var(--header-bg);
      color: var(--button-text);
      padding: 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
      user-select: none;
    }

    main {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1rem;
    }

    h1, h2 {
      margin-bottom: 1rem;
    }

    .repo a {
      color: var(--primary);
      text-decoration: none;
      font-size: 1.5rem;
      font-weight: bold;
    }

    .repo p {
      margin: 0.5rem 0;
      line-height: 1.5;
    }

    .centered {
      display: flex;
      justify-content: center;
      margin: 2rem 0;
    }

    footer {
      text-align: center;
      color: #aaa;
      padding: 2rem 0;
    }

    #toggle-theme {
      background-color: var(--button-bg);
      border: none;
      color: var(--button-text);
      padding: 0.5rem 1rem;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.3s ease;
      flex-shrink: 0;
    }
    #toggle-theme:hover {
      background-color: #024ea2;
    }

    figure {
      max-width: 800px;
      margin: 2rem auto;
    }

    figure embed {
      border: none;
      width: 100%;
      height: 200px; /* fixed height */
      display: block;
    }

    @keyframes slideIn {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

<header>
  <h1><strong>Chaose3</strong></h1>
  <button id="toggle-theme" aria-label="Toggle dark mode">Switch to Light Mode</button>
</header>

<main>
  <h2>Pinned Projects</h2>
  <div id="pinned-projects">Loading...</div>

  <div class="centered">
    <a href="https://spotify-github-profile.kittinanx.com/api/view?uid=31kk26po4edf6cl3ilikbvd25cmm&redirect=true" target="_blank" rel="noopener noreferrer">
      <img
              src="https://spotify-github-profile.kittinanx.com/api/view?uid=31kk26po4edf6cl3ilikbvd25cmm&cover_image=true&theme=default&show_offline=false&background_color=121212&interchange=false&bar_color_cover=false"
              alt="Spotify GitHub Profile"
              style="max-width: 100%; height: auto;"
      />
    </a>
  </div>

  <h2>All Projects</h2>
  <div id="repos">Loading...</div>

  <h2>My WakaTime Stats</h2>
  <figure>
    <embed
            src="https://wakatime.com/share/@Chaose3/7c2bbe5c-05a1-46b3-a645-ae95a493e244.svg"
            loading="lazy"
            title="WakaTime Coding Stats"
    >
  </figure>
</main>

<footer>
  &copy; <span id="year"></span> Chaose3
</footer>

<script>
  // Dark mode toggle logic
  const toggleBtn = document.getElementById('toggle-theme');
  const root = document.documentElement;

  function applyTheme(theme) {
    root.setAttribute('data-theme', theme);
    toggleBtn.textContent = theme === 'light' ? 'Switch to Dark Mode' : 'Switch to Light Mode';
    localStorage.setItem('theme', theme);
  }

  // Load saved theme or default to dark
  const savedTheme = localStorage.getItem('theme') || 'dark';
  applyTheme(savedTheme);

  toggleBtn.addEventListener('click', () => {
    const currentTheme = root.getAttribute('data-theme');
    const newTheme = currentTheme === 'light' ? 'dark' : 'light';
    applyTheme(newTheme);
  });

  // Load GitHub repos and pinned projects
  const username = "chaose3";

  async function loadRepos() {
    const repoContainer = document.getElementById('repos');
    const pinnedContainer = document.getElementById('pinned-projects');
    try {
      const res = await fetch(`https://api.github.com/users/${username}/repos?sort=updated`);
      const repos = await res.json();

      repoContainer.innerHTML = '';
      pinnedContainer.innerHTML = '';

      const pinned = ["Chaotick", "Form Flooder"];
      let delay = 0;

      repos.forEach(repo => {
        const el = document.createElement('div');
        el.className = 'repo';
        el.style.animationDelay = `${delay}s`;
        delay += 0.1;

        el.innerHTML = `
          <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer">${repo.name}</a>
          <p>${repo.description || 'No description'}</p>
          <p><small>⭐ ${repo.stargazers_count} | Updated ${new Date(repo.updated_at).toLocaleDateString()}</small></p>
        `;

        if (pinned.includes(repo.name)) {
          pinnedContainer.appendChild(el.cloneNode(true));
        }

        repoContainer.appendChild(el);
      });
    } catch (err) {
      repoContainer.innerHTML = 'Failed to load repositories.';
      pinnedContainer.innerHTML = 'Failed to load pinned projects.';
    }
  }

  document.getElementById('year').textContent = new Date().getFullYear();
  loadRepos();
</script>

</body>
</html>
